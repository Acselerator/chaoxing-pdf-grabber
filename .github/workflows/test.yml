name: test

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: 单元测试 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 语法检查
        run: node --check chaoxing-pdf-grabber.user.js
      - name: 跑单元测试
        run: node --test test/unit.test.mjs
